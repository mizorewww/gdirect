[package]
name = "gdirect"
version = "0.13.2"
edition = "2024"
description = "Browse, transfer and mount Google Drive with native Google authentication"
license = "GPL-2.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
scraper = "0.24"
url = "2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.3"
md-5 = "0.11"
unicode-width = "0.2"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[build-dependencies]
cc = "1"
