name: Upstream port

# Renovate (renovate.yml) opens renovate/gpui-kit-material when a new
# gpui-kit-material is released. Claude Code moves the desktop client to it on that
# branch following .github/upstream-port.md and commits locally; it cannot push. The next step pushes as the maintainer, so CI
# runs on the result, and labels the PR port-ready when Claude reports the port
# complete. upstream-land.yml then merges it once CI passes.
# When CI fails on the branch, ci-heal.yml starts this again with fix_run: Claude
# fixes the failure (five tries), or the failed jobs are rerun when it is not the port's.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      branch:
        description: Renovate branch
        default: renovate/gpui-kit-material
      fix_run:
        description: Failed CI run to fix (set by ci-heal.yml)
        default: ""

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  # Our own port commit comes back as a synchronize event; only Renovate's start a
  # port, or a dispatch. Outside the port's concurrency group, so that check cannot
  # cancel the port that pushed the commit.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.pull_request.head.ref, 'renovate/gpui-') &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BRANCH: ${{ github.head_ref || inputs.branch }}
      GH_TOKEN: ${{ github.token }}
      CARGO_BUILD_JOBS: 4
    outputs:
      run: ${{ steps.gate.outputs.run }}
      start: ${{ steps.gate.outputs.start }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the head is Renovate's, or a failed port to fix
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          FIX_RUN: ${{ inputs.fix_run }}
        run: |
          ours() { git log -1 --format=%B | grep -q '^Co-Authored-By: Claude'; }
          run=true mode=port
          if [ -n "$FIX_RUN" ] && ours; then
            # Fix CI on the port's commit, five tries at most; on Renovate's commit, port it.
            mode=fix
            pr=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
            tries=0
            [ -z "$pr" ] || tries=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq '.[].body' | grep -c 'Automated CI fix' || true)
            [ "$tries" -lt 5 ] || run=false
          elif ours; then
            # The port is already on the branch; only a CI failure (fix_run) runs it again.
            run=false
          fi
          # Several CI runs can ask for a fix of one commit; a later request finds the
          # first one's commit and has nothing to do.
          if [ -n "$FIX_RUN" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FIX_RUN" --jq .head_sha)" != "$(git rev-parse HEAD)" ]; then
            run=false
          fi
          { echo "run=$run"; echo "mode=$mode"; echo "start=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"

  port:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    concurrency:
      group: upstream-port-${{ github.head_ref || inputs.branch }}
      # Only a newer Renovate push cancels; a dispatch waits, and is skipped if the branch moved.
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BRANCH: ${{ github.head_ref || inputs.branch }}
      GH_TOKEN: ${{ github.token }}
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the branch has not moved
        id: fresh
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ needs.gate.outputs.start }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust, Linux libraries and libaria2
        if: steps.fresh.outputs.ok
        run: |
          rustup update stable
          rustup component add clippy rustfmt
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev
          ./scripts/build-libaria2.sh
      - uses: Swatinem/rust-cache@v2
        if: steps.fresh.outputs.ok
        with:
          key: desktop-port
          workspaces: desktop -> target
      - uses: anthropics/claude-code-action@v1
        if: steps.fresh.outputs.ok
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The port works on public code only; keep its transcript in the log.
          show_full_output: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          restrict_untrusted_prs: "false"
          claude_args: |
            --model claude-opus-5-5
            --max-turns 400
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,TodoWrite
            --json-schema '{"type":"object","required":["ready","summary"],"properties":{"ready":{"type":"boolean"},"summary":{"type":"string"}}}'
          prompt: |
            ${{ needs.gate.outputs.mode == 'fix' && 'CI failed on the port commit at the head of' || 'Port the dependency update on' }} branch ${{ env.BRANCH }} of ${{ github.repository }}.
            The repository is checked out in the working directory on that branch.
            Follow .github/upstream-port.md exactly.
            ${{ needs.gate.outputs.mode == 'fix' && format('
            Fix that failure. `gh run list --commit $(git rev-parse HEAD)` lists the CI runs and
            `gh run view <id> --log-failed` shows what failed (run {0} is one). Find the cause,
            fix it as the instructions allow (never by weakening a check or a test), and run the
            checks again. If the failure is not this branch''s (a runner, network or flaky
            failure), change nothing and say so; the workflow then reruns the failed jobs.
            ', inputs.fix_run) || '' }}
            Run every command in the foreground and wait for it to finish; the job ends when you answer.

            Commit with exactly:
              git -c user.name='claude[bot]' -c user.email='41898282+claude[bot]@users.noreply.github.com' \
                commit --author 'mizorewww <aac6fef@icloud.com>' \
                --trailer 'Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>'
            Do not push; the workflow pushes your commits.

            Return `ready`: true only when the port is complete and every check in the
            instructions passed. `summary` is posted on the pull request as the maintainer:
            what changed upstream, what you changed, what you ran and the results, and
            anything left for a human. Write plainly and do not sign it.
      - name: Push and report as the maintainer
        # Not after a cancel: a newer Renovate push superseded this port.
        if: ${{ !cancelled() && steps.fresh.outputs.ok }}
        env:
          GH_TOKEN: ${{ secrets.MAINTAINER_TOKEN }}
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          START: ${{ needs.gate.outputs.start }}
          MODE: ${{ needs.gate.outputs.mode }}
          FAILED_RUN: ${{ inputs.fix_run }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ "$(git rev-parse HEAD)" != "$START" ]; then
            # Bypass the read-only credentials the Claude action configured for this checkout.
            git -c credential.helper= -c http.https://github.com/.extraheader= \
              push -q "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          elif [ "$MODE" = fix ]; then
            # Nothing to change: the failure was not the port's, so try the failed jobs again.
            gh run rerun "$FAILED_RUN" --failed
          fi
          [ "$MODE" = fix ] && kind="CI fix" || kind="port"
          summary=$(jq -r '.summary // empty' <<<"$OUTPUT")
          printf '%s\n\n<sub>Automated %s by Claude Code ([run](%s)).</sub>\n' \
            "${summary:-The $kind did not finish; see the run log.}" "$kind" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/summary.md"
          [ -z "$pr" ] || gh pr comment "$pr" --body-file "$RUNNER_TEMP/summary.md"
          # REST, not `gh pr edit`: its GraphQL query needs read:org, which the token lacks.
          labels="repos/$GITHUB_REPOSITORY/issues/$pr/labels"
          if [ -n "$pr" ] && [ "$(jq -r '.ready // false' <<<"$OUTPUT")" = true ]; then
            gh api "$labels" -f 'labels[]=port-ready' --silent
          elif [ -n "$pr" ]; then
            gh api -X DELETE "$labels/port-ready" --silent 2>/dev/null || true
          fi
