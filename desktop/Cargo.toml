# The desktop client. Its own workspace, so the command-line build and its
# release pipeline never resolve the GUI stack.
[package]
name = "gdirect-desktop"
version = "0.13.2"
edition = "2024"
description = "Desktop client for gdirect: browse, transfer and mount Google Drive"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "gdirect-desktop"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
gdirect = { path = ".." }
anyhow = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
sys-locale = "0.3"
# The Material 3 library and the Kit release it is built on, from crates.io.
gpui-kit = "0.9.1"
gpui-kit-material = "0.1"
gpui-material-symbols = { version = "0.1", default-features = false, features = ["gpui-kit"] }

[workspace]

# Release builds ship without debug symbols, a large part of the binary.
[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.gpui-fast]
opt-level = 3
